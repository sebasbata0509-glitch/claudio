name: tone-ayan

on:
  push:
    paths:
      - "tone-ayan/**"
      - ".github/workflows/tone-ayan.yml"
  pull_request:
    paths:
      - "tone-ayan/**"
      - ".github/workflows/tone-ayan.yml"
  workflow_dispatch:

jobs:
  build:
    name: Tone-ayan ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            pluginval: pluginval_Windows.zip
            pluginval_bin: pluginval.exe
          - name: Linux x64
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
            pluginval_bin: pluginval

    defaults:
      run:
        shell: bash
        working-directory: tone-ayan

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libxcomposite-dev libxi-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb ninja-build

      - name: Configure
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -S . -B build -A x64
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONEAYAN_WERROR=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests (DSP core + plugin layer)
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: CLI smoke test
        run: |
          CLI=$(find build/tools -name 'tone-ayan-cli*' -type f -perm -u+x | head -n 1)
          "$CLI" demo demo.wav
          "$CLI" compare demo.wav examples/edits.json
          "$CLI" render demo.wav examples/edits.json demo-edited.wav

      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q pluginval.zip
          VST3=build/src/plugin/ToneAyan_artefacts/Release/VST3/Tone-ayan.vst3
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a ./${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process "$VST3"
          else
            ./${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process "$VST3"
          fi

      - name: Package
        run: |
          mkdir -p package
          cp -r build/src/plugin/ToneAyan_artefacts/Release/VST3/Tone-ayan.vst3 package/
          cp -r build/src/plugin/ToneAyan_artefacts/Release/Standalone/* package/
          find build/tools -name 'tone-ayan-cli*' -type f -perm -u+x -exec cp {} package/ \;
          cp demo.wav demo-edited.wav examples/edits.json package/
          cp README.md package/LEEME.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Tone-ayan-${{ runner.os }}
          path: tone-ayan/package
          if-no-files-found: error
